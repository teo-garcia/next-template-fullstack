name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint:es:check

      - name: Type check
        run: pnpm lint:ts

      - name: Format check
        run: pnpm format:check

      - name: Coverage
        run: pnpm coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Start production server
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=43117 node .next/standalone/server.js > "$RUNNER_TEMP/web-conformance.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/web-conformance.pid"

      - name: Shared web conformance
        uses: teo-garcia/templates/conformance/web@a61b1980d9cbeef0e8bf3d255d7221ca25166810
        with:
          base_url: http://127.0.0.1:43117

      - name: Upload conformance log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-conformance-log
          path: ${{ runner.temp }}/web-conformance.log
          retention-days: 7

      - name: Stop production server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/web-conformance.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/web-conformance.pid")" 2>/dev/null || true
          fi
